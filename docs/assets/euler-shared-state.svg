<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="euler-title euler-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <!-- SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0 -->
  <!-- Copyright 2026 Qiuyu Chen (canghaimeng). Conceptual diagram; it depicts no research data or result. -->
  <title id="euler-title">Euler: one shared research state for researchers and agent teams</title>
  <desc id="euler-desc">Conceptual diagram. Researchers and an agent team read and extend the same shared research state: statements and scope, goals and steps, proof routes, dependencies, failed attempts and evidence. The frontier, made of open goals, live routes, blockers and their evidence, is the active projection of that state. A proposal reaches the admitted Fact Graph only through the required evidence. Git milestones save the whole team, and a saved milestone can be restored into an independent branch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C959F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B7285"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="519" rx="18" fill="#F6F8FA" stroke="#D8DEE4"/>

  <!-- Researchers -->
  <rect x="24" y="24" width="200" height="308" rx="14" fill="#FFFFFF" stroke="#D8DEE4"/>
  <circle cx="50" cy="54" r="12" fill="#E3F4F6" stroke="#0B7285" stroke-width="1.2"/>
  <circle cx="50" cy="50.5" r="3.4" fill="#0B7285"/>
  <path d="M43 61 a7 6 0 0 1 14 0 z" fill="#0B7285"/>
  <text x="72" y="59" font-size="15" font-weight="600" fill="#1F2328">Researchers</text>
  <text x="40" y="88" font-size="11" fill="#57606A">follow the whole process</text>
  <line x1="40" y1="100" x2="208" y2="100" stroke="#EAEEF2"/>
  <g font-size="12" font-weight="600" fill="#1F2328">
    <text x="54" y="124">Read every record</text>
    <text x="54" y="174">Ask about a step</text>
    <text x="54" y="224">Intervene in scope</text>
    <text x="54" y="274">Save &amp; branch</text>
  </g>
  <g font-size="10.5" fill="#57606A">
    <text x="54" y="140">six workbench views</text>
    <text x="54" y="190">statement &amp; scope attached</text>
    <text x="54" y="240">explicit, bounded requests</text>
    <text x="54" y="290">whole-team Git milestones</text>
  </g>
  <g fill="#0B7285">
    <circle cx="45" cy="120" r="3"/>
    <circle cx="45" cy="170" r="3"/>
    <circle cx="45" cy="220" r="3"/>
    <circle cx="45" cy="270" r="3"/>
  </g>

  <!-- Agent team -->
  <rect x="736" y="24" width="200" height="308" rx="14" fill="#FFFFFF" stroke="#D8DEE4"/>
  <circle cx="762" cy="54" r="12" fill="#F0EBFA" stroke="#6639BA" stroke-width="1.2"/>
  <g stroke="#6639BA" stroke-width="1.2">
    <line x1="757" y1="58" x2="767" y2="58"/>
    <line x1="757" y1="58" x2="762" y2="49.5"/>
    <line x1="767" y1="58" x2="762" y2="49.5"/>
  </g>
  <g fill="#6639BA">
    <circle cx="757" cy="58" r="2.6"/>
    <circle cx="767" cy="58" r="2.6"/>
    <circle cx="762" cy="49.5" r="2.6"/>
  </g>
  <text x="784" y="59" font-size="15" font-weight="600" fill="#1F2328">Agent team</text>
  <text x="752" y="88" font-size="11" fill="#57606A">one lead, any assistants</text>
  <line x1="752" y1="100" x2="920" y2="100" stroke="#EAEEF2"/>
  <g font-size="12" font-weight="600" fill="#1F2328">
    <text x="766" y="124">Read the frontier</text>
    <text x="766" y="174">Propose next steps</text>
    <text x="766" y="224">Consult teammates</text>
    <text x="766" y="274">Native CLI sessions</text>
  </g>
  <g font-size="10.5" fill="#57606A">
    <text x="766" y="140">exact records, not recaps</text>
    <text x="766" y="190">recorded as open proposals</text>
    <text x="766" y="240">replies return to the lead</text>
    <text x="766" y="290">Codex &#183; Claude Code</text>
    <text x="766" y="304">Gemini CLI &#183; Grok &#183; Cursor</text>
  </g>
  <g fill="#6639BA">
    <circle cx="757" cy="120" r="3"/>
    <circle cx="757" cy="170" r="3"/>
    <circle cx="757" cy="220" r="3"/>
    <circle cx="757" cy="270" r="3"/>
  </g>

  <!-- Shared research state -->
  <rect x="294" y="24" width="372" height="308" rx="16" fill="#FFFFFF" stroke="#B6D4F7" stroke-width="1.5"/>
  <text x="480" y="56" text-anchor="middle" font-size="17" font-weight="600" fill="#1F2328">Shared research state</text>
  <text x="480" y="76" text-anchor="middle" font-size="11.5" fill="#57606A">one structure for researchers and agents alike</text>
  <g fill="#EEF4FD" stroke="#B6D4F7">
    <rect x="310" y="94" width="166" height="32" rx="8"/>
    <rect x="484" y="94" width="166" height="32" rx="8"/>
    <rect x="310" y="134" width="166" height="32" rx="8"/>
    <rect x="484" y="134" width="166" height="32" rx="8"/>
    <rect x="310" y="174" width="166" height="32" rx="8"/>
    <rect x="484" y="174" width="166" height="32" rx="8"/>
  </g>
  <g font-size="12" font-weight="500" fill="#0A3069" text-anchor="middle">
    <text x="393" y="114.5">Statement &amp; scope</text>
    <text x="567" y="114.5">Goals &amp; steps</text>
    <text x="393" y="154.5">Proof routes</text>
    <text x="567" y="154.5">Dependencies</text>
    <text x="393" y="194.5">Failed attempts</text>
    <text x="567" y="194.5">Evidence</text>
  </g>
  <rect x="310" y="222" width="340" height="88" rx="10" fill="#FFF8E5" stroke="#D4A72C" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="330" cy="243" r="8" fill="none" stroke="#BF8700" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="330" cy="243" r="4" fill="#BF8700"/>
  <text x="346" y="247.5" font-size="13" font-weight="600" fill="#7D4E00">Frontier<tspan font-weight="400" fill="#57606A"> &#8212; its active projection</tspan></text>
  <g font-size="11" fill="#3D444D">
    <text x="326" y="272">open goals, live routes, blockers</text>
    <text x="326" y="288">and the evidence attached to them</text>
  </g>

  <!-- Reading and writing the same state -->
  <g stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="290" y1="150" x2="230" y2="150"/>
    <line x1="230" y1="190" x2="290" y2="190"/>
    <line x1="670" y1="150" x2="730" y2="150"/>
    <line x1="730" y1="190" x2="670" y2="190"/>
  </g>
  <g font-size="10.5" fill="#57606A" text-anchor="middle">
    <text x="260" y="142">reads</text>
    <text x="260" y="207">asks</text>
    <text x="700" y="142">reads</text>
    <text x="700" y="207">proposes</text>
  </g>

  <!-- Links to admission and milestones -->
  <g stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="400" y1="355" x2="400" y2="336"/>
    <line x1="560" y1="333" x2="560" y2="352"/>
  </g>
  <g font-size="10" fill="#57606A">
    <text x="408" y="348">admits</text>
    <text x="568" y="348">saves</text>
  </g>

  <!-- Evidence-gated admission -->
  <rect x="24" y="356" width="444" height="140" rx="14" fill="#FFFFFF" stroke="#D8DEE4"/>
  <rect x="44" y="374" width="10" height="10" rx="2.5" fill="#1A7F37"/>
  <text x="62" y="383.5" font-size="13.5" font-weight="600" fill="#1F2328">Evidence-gated admission</text>
  <text x="44" y="404" font-size="11" fill="#57606A">drafts and peer reviews stay proposals until checked</text>
  <rect x="44" y="420" width="100" height="52" rx="9" fill="#F6F8FA" stroke="#D0D7DE"/>
  <rect x="170" y="420" width="160" height="52" rx="9" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.4"/>
  <rect x="356" y="420" width="92" height="52" rx="9" fill="#EAF6EE" stroke="#A6D8B4"/>
  <g stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="146" y1="446" x2="166" y2="446"/>
    <line x1="332" y1="446" x2="352" y2="446"/>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="94" y="442" fill="#1F2328">Proposal</text>
    <text x="250" y="442" fill="#1F2328">Required evidence</text>
    <text x="402" y="442" fill="#116329">Fact Graph</text>
  </g>
  <g font-size="10.5" fill="#57606A" text-anchor="middle">
    <text x="94" y="458">route or step</text>
    <text x="250" y="458">proof check or Lean kernel</text>
    <text x="402" y="458">admitted</text>
  </g>

  <!-- Whole-team Git milestones -->
  <rect x="492" y="356" width="444" height="140" rx="14" fill="#FFFFFF" stroke="#D8DEE4"/>
  <rect x="512" y="374" width="10" height="10" rx="2.5" fill="#0969DA"/>
  <text x="530" y="383.5" font-size="13.5" font-weight="600" fill="#1F2328">Whole-team Git milestones</text>
  <text x="512" y="404" font-size="11" fill="#57606A">files, graphs, evidence and native sessions, saved together</text>
  <line x1="520" y1="432" x2="908" y2="432" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 432 C600 452 612 466 634 466 L776 466" fill="none" stroke="#0B7285" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <g fill="#FFFFFF" stroke="#0969DA" stroke-width="2">
    <circle cx="540" cy="432" r="5.5"/>
    <circle cx="600" cy="432" r="5.5"/>
    <circle cx="660" cy="432" r="5.5"/>
    <circle cx="720" cy="432" r="5.5"/>
    <circle cx="780" cy="432" r="5.5"/>
  </g>
  <g fill="#E3F4F6" stroke="#0B7285" stroke-width="2">
    <circle cx="680" cy="466" r="5.5"/>
    <circle cx="740" cy="466" r="5.5"/>
  </g>
  <g font-size="10.5" fill="#57606A">
    <text x="916" y="423" text-anchor="end">original workspace</text>
    <text x="786" y="470">independent branch</text>
  </g>
  <text x="592" y="466" text-anchor="end" font-size="10.5" fill="#0B7285">restore</text>
</svg>
